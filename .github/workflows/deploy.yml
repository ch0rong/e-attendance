name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site with secret config
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
        run: |
          mkdir -p _site
          cp index.html admin.html style.css app.js admin.js _site/
          cp -r assets _site/
          node -e "
            const fs = require('fs');
            const url = (process.env.GAS_WEB_APP_URL || '').trim();
            const cfg = {
              IS_TEST_MODE: !url,
              GAS_WEB_APP_URL: url,
            };
            fs.writeFileSync('_site/config.js', 'window.APP_CONFIG = ' + JSON.stringify(cfg, null, 2) + ';\n');
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
